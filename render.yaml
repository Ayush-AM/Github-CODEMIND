services:
  - type: web
    name: codemind-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: STORAGE_ROOT
        value: /tmp/data
      - key: FRONTEND_DIST_DIR
        value: /app/frontend/dist
